# Broker configuration for the solution (ADR-0001). Anonymous and unencrypted: local development only.
listener 1883
allow_anonymous true

# Limits raised after the spike (spikes/mqtt/FINDINGS.md): the defaults (1,000 queued messages) drop messages silently
# for an offline consumer at the assignment's load of 1,000 messages per second.
max_queued_messages 200000
max_inflight_messages 1000

# Persistent sessions survive a broker restart.
persistence true
persistence_location /mosquitto/data/
